name: Core checks
on:
  pull_request:
  push:
    branches: [main, integration, 'ci/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner resources
        run: |
          sw_vers
          uname -m
          sysctl -n hw.memsize hw.logicalcpu
          df -h .
          xcodebuild -version
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: '**/go.sum'
      - name: Product manager and Agent transport contracts
        run: |
          ./productManager/selfTest.command
          ./productManager/agentSelfTest.command
      - name: Go core contracts
        shell: bash
        run: |
          set -euo pipefail
          for module in gameDownloader manifestPlanner downloaderCoreBootstrap globalAdapter runtimeBootstrap idvLoginComponent/downloader; do
            (cd "$module" && go test ./... && go vet ./...)
          done
      - name: Localization contracts
        run: python3 playerLauncherApp/Tests/launcherLocalizationResourcesSelfTest.py playerLauncherApp
  official-network:
    if: startsWith(github.ref, 'refs/heads/ci/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Real official resolver smoke, no game payload
        run: ./productManager/selfTest.command --network-smoke
